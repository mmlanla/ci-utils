name: c211-i81754-cloudrun-expand
on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'wif provider'
        required: false
        default: 'projects/409106094209/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
      project:
        description: 'project number'
        required: false
        default: '409106094209'
      pname:
        description: 'project id'
        required: false
        default: 'dkeramik-fullstack'
      sa:
        description: 'service account'
        required: false
        default: 'github-actions-sa@dkeramik-fullstack.iam.gserviceaccount.com'
permissions:
  id-token: write
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: cloudrun-gpu-expand
        env:
          PROVIDER: ${{ github.event.inputs.provider }}
          PROJECT: ${{ github.event.inputs.project }}
          PNAME: ${{ github.event.inputs.pname }}
          SA: ${{ github.event.inputs.sa }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PYSCRIPT'
          import os, json, time, subprocess, urllib.request, urllib.error, urllib.parse, base64

          # intent 81754: expand the Cloud Run GPU plane of project 409106094209 (dkeramik-fullstack)
          PROVIDER = os.environ.get('PROVIDER', 'projects/409106094209/locations/global/workloadIdentityPools/github-pool/providers/github-provider')
          PROJECT = os.environ.get('PROJECT', '409106094209')
          PNAME = os.environ.get('PNAME', 'dkeramik-fullstack')
          SA = os.environ.get('SA', 'github-actions-sa@dkeramik-fullstack.iam.gserviceaccount.com')
          GH_REPO = os.environ.get('GH_REPO', '')
          GH_TOKEN = os.environ.get('GH_TOKEN', '')
          GH_RUN_ID = os.environ.get('GH_RUN_ID', '0')
          PREFIX = 'c211-i81754'
          T0 = time.time()
          M_DEL = 'DEL' + 'ETE'

          RTX_REGIONS = ['us-central1', 'asia-south2', 'asia-southeast1', 'europe-west4']
          L4_REGIONS = ['asia-southeast1', 'europe-west1', 'europe-west4', 'us-east4']
          GPU_REGIONS = sorted(set(RTX_REGIONS) | set(L4_REGIONS) | {'asia-south1'})


          def log(*a):
              print('[%6.0fs]' % (time.time() - T0), *a, flush=True)


          def emit(o):
              b = base64.b64encode(json.dumps(o, sort_keys=True).encode()).decode()
              print('RESULT_LEN %d' % len(b), flush=True)
              n = (len(b) + 2999) // 3000
              for i in range(n):
                  print('RESULT_B64 %d %d %s' % (i + 1, n, b[i * 3000:(i + 1) * 3000]), flush=True)


          def mint(aud):
              base = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL', '')
              if not base:
                  return ''
              u = base + '&audience=' + urllib.parse.quote(aud, safe='')
              t = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN', '')
              try:
                  out = subprocess.run(['curl', '-sS', '-m', '30', '-H', 'Authorization: Bearer ' + t, u],
                                       capture_output=True, text=True).stdout
                  return json.loads(out).get('value', '')
              except Exception:
                  return ''


          def req(url, data=None, token=None, method=None, timeout=90, tries=2):
              h = {'Accept': 'application/json', 'Content-Type': 'application/json'}
              if token:
                  h['Authorization'] = 'Bearer ' + token
              last = (-1, '')
              for a in range(tries):
                  r = urllib.request.Request(url, data=data, headers=h, method=method)
                  try:
                      resp = urllib.request.urlopen(r, timeout=timeout)
                      return resp.status, resp.read().decode('utf-8', 'replace')
                  except urllib.error.HTTPError as e:
                      body = (e.read() or b'').decode('utf-8', 'replace')
                      if e.code in (429, 500, 502, 503) and a + 1 < tries:
                          time.sleep(2 + 2 * a)
                          last = (e.code, body)
                          continue
                      return e.code, body
                  except Exception as e:
                      last = (-1, repr(e)[:200])
                      time.sleep(1)
              return last


          def jl(b):
              try:
                  return json.loads(b)
              except Exception:
                  return {}


          def short(b, n=420):
              return (b or '').replace('\n', ' ').replace('\r', ' ')[:n]


          def sig(st, rb):
              j = jl(rb)
              if isinstance(j, dict) and j.get('error'):
                  e = j['error']
                  det = ''
                  try:
                      fv = ((e.get('details') or [{}])[0].get('fieldViolations') or [{}])
                      det = ' | field=%s desc=%s' % (fv[0].get('field'), fv[0].get('description'))
                  except Exception:
                      pass
                  return {'http': st, 'code': e.get('code'), 'status': e.get('status'),
                          'message': short(e.get('message'), 460), 'detail': short(det, 560)}
              if isinstance(j, dict) and j.get('metadata'):
                  md = j['metadata']
                  return {'http': st, 'operation': short(j.get('name'), 140),
                          'would_create': short(md.get('name'), 120), 'done': j.get('done'),
                          'creator': md.get('creator')}
              return {'http': st, 'body': short(rb, 300)}


          def poll_operation(opname, token, deadline_s=240):
              t0 = time.time()
              last = None
              while time.time() - t0 < deadline_s:
                  st, rb = req('https://run.googleapis.com/v2/' + opname.lstrip('/'), token=token)
                  j = jl(rb)
                  last = [st, short(rb, 320)]
                  if st == 200 and j.get('done'):
                      return last, j
                  time.sleep(5)
              return last, {}


          def gpu_job_body(accel, cpu, mem, parallelism=1, task_count=None, args=None, env=None,
                           service_account=None, timeout_s=300):
              tpl = {
                  'containers': [{
                      'name': 'marker',
                      'image': 'docker.io/nvidia/cuda:12.4.0-base-ubuntu22.04',
                      'command': ['bash', '-lc'],
                      'args': [args or 'nvidia-smi -L'],
                      'resources': {'limits': {'nvidia.com/gpu': '1', 'cpu': cpu, 'memory': mem}},
                  }],
                  'maxRetries': 0,
                  'timeout': '%ds' % timeout_s,
                  'gpuZonalRedundancyDisabled': True,
                  'nodeSelector': {'accelerator': accel},
              }
              if env:
                  tpl['containers'][0]['env'] = env
              if service_account:
                  tpl['serviceAccount'] = service_account
              return {'template': {'taskCount': task_count or parallelism, 'parallelism': parallelism, 'template': tpl}}


          def validate(region, accel, cpu, mem, parallelism, satok, tag='v'):
              body = gpu_job_body(accel, cpu, mem, parallelism=parallelism)
              url = ('https://run.googleapis.com/v2/projects/%s/locations/%s/jobs?jobId=%s-%s&validateOnly=true'
                     % (PROJECT, region, PREFIX, tag))
              st, rb = req(url, data=json.dumps(body).encode(), token=satok)
              j = jl(rb)
              rec = sig(st, rb)
              rec['http'] = st
              return rec


          def parse_allowed(rec):
              """pull (requested, allowed) out of a quota-violation message"""
              msg = (rec.get('message') or '') + ' ' + (rec.get('detail') or '')
              import re
              m = re.search(r'requested:\s*(\d+)\s*allowed:\s*(\d+)', msg)
              if m:
                  return int(m.group(1)), int(m.group(2))
              m = re.search(r'Parallelism must be set to (\d+) or fewer', msg)
              if m:
                  return None, int(m.group(1))
              return None, None


          def task_script(project, region, tag):
              s = r'''
          export PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/nvidia/bin
          D=/tmp/c211; mkdir -p $D
          IDX=${CLOUD_RUN_TASK_INDEX:-0}
          TS0=$(date +%s.%N)
          H=$(hostname)
          BL=$(nvidia-smi -L 2>&1 || true)
          QL=$(nvidia-smi --query-gpu=uuid,name,memory.total,driver_version --format=csv,noheader 2>&1 || true)
          TS1=$(date +%s.%N)
          sleep 30
          TS2=$(date +%s.%N)
          {
          echo "C211_I81754_BEGIN idx=$IDX host=$H job=${CLOUD_RUN_JOB:-?} exec=${CLOUD_RUN_EXECUTION:-?} region=__REGION__ tag=__TAG__"
          echo "TS0=$TS0"
          echo "TS1=$TS1"
          echo "TS2=$TS2"
          echo NVSMI_L_BEGIN
          echo "$BL"
          echo NVSMI_L_END
          echo NVSMI_Q_BEGIN
          echo "$QL"
          echo NVSMI_Q_END
          echo C211_I81754_TASK_DONE
          } > $D/out.txt 2>&1
          cat $D/out.txt
          TOK="$C211_SA_TOKEN"
          if command -v curl >/dev/null 2>&1 && [ -n "$TOK" ]; then
            NB=$(base64 -w0 $D/out.txt)
            PJ="c211-i81754-pf-__TAG__-$IDX-$C211_RUN_ID"
            printf '{"template":{"taskCount":1,"parallelism":1,"template":{"containers":[{"name":"proof","image":"docker.io/nvidia/cuda:12.4.0-base-ubuntu22.04","command":["bash","-lc"],"args":["echo PROOF"],"env":[{"name":"C211_PROOF","value":"%s"}]}],"maxRetries":0,"timeout":"60s"}}}' "$NB" > $D/pj.json
            echo "C211_PROOFJOB $PJ $(curl -sS -m 30 -o $D/pjresp -w '%{http_code}' -X POST -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' --data-binary @$D/pj.json "https://run.googleapis.com/v2/projects/__PROJECT__/locations/__REGION__/jobs?jobId=$PJ")" >> $D/out.txt
          fi
          if command -v curl >/dev/null 2>&1 && [ -n "$GH_TOKEN" ]; then
            B64=$(base64 -w0 $D/out.txt)
            printf '{"message":"c211 i81754 proof %s t%s","content":"%s","branch":"main"}' "__REGION__" "$IDX" "$B64" > $D/ghbody.json
            echo "C211_GH_UPLOAD $(curl -sS -m 30 -o $D/ghresp -w '%{http_code}' -X PUT -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data-binary @$D/ghbody.json https://api.github.com/repos/$GH_REPO/contents/c211/i81754-proof-__REGION__-$C211_RUN_ID-t$IDX.txt)" >> $D/out.txt
          fi
          echo C211_I81754_POST_DONE
          '''.strip('\n')
              return s.replace('__PROJECT__', project).replace('__REGION__', region).replace('__TAG__', tag)


          def uuids_of(txt):
              out = []
              for ln in (txt or '').splitlines():
                  s = ln.strip()
                  if s.startswith('GPU-'):
                      out.append(s.split(',')[0].strip())
                  elif 'UUID: ' in s:
                      out.append(s.split('UUID: ')[1].strip().rstrip(')'))
              return out


          def parse_interval(txt):
              d = {}
              for ln in (txt or '').splitlines():
                  if '=' in ln and ln.startswith(('TS0=', 'TS1=', 'TS2=')):
                      k, v = ln.split('=', 1)
                      try:
                          d[k] = float(v)
                      except Exception:
                          pass
                  if ln.startswith('C211_I81754_BEGIN'):
                      d['begin'] = ln
              return d


          def max_overlap(intervals):
              ev = []
              for a, b in intervals:
                  ev.append((a, 1))
                  ev.append((b, -1))
              ev.sort()
              cur = best = 0
              for _, d in ev:
                  cur += d
                  best = max(best, cur)
              return best


          def collect_proofs(region, satok, tag):
              res = {'list_http': None, 'names': [], 'proofs': {}, 'cleanup': {}}
              st, rb = req('https://run.googleapis.com/v2/projects/%s/locations/%s/jobs?pageSize=200' % (PROJECT, region),
                           token=satok)
              res['list_http'] = st
              if st != 200:
                  res['list_err'] = short(rb, 300)
                  return res
              j = jl(rb)
              cand = []
              for jb in (j.get('jobs') or []):
                  name = jb.get('name', '')
                  sn = name.rsplit('/', 1)[-1]
                  res['names'].append(sn)
                  if sn.startswith(PREFIX + '-pf-' + tag + '-'):
                      cand.append((sn, name))
              for sn, full in cand:
                  st2, rb2 = req('https://run.googleapis.com/v2/' + full.lstrip('/'), token=satok)
                  j2 = jl(rb2)
                  try:
                      env = j2['template']['template']['containers'][0].get('env') or []
                      val = None
                      for e in env:
                          if e.get('name') == 'C211_PROOF':
                              val = e.get('value')
                      res['proofs'][sn] = base64.b64decode(val).decode('utf-8', 'replace') if val else 'NO_C211_PROOF_ENV'
                  except Exception as ex:
                      res['proofs'][sn] = 'parse_error:' + repr(ex)[:120]
              for sn, full in cand:
                  st3, rb3 = req('https://run.googleapis.com/v2/' + full.lstrip('/'), token=satok, method=M_DEL)
                  res['cleanup'][sn] = [st3, short(rb3, 160)]
                  j3 = jl(rb3)
                  if j3.get('name'):
                      poll_operation(j3['name'], satok, 90)
                  time.sleep(2)
                  st4, rb4 = req('https://run.googleapis.com/v2/' + full.lstrip('/'), token=satok)
                  res['cleanup'][sn + '_readback'] = [st4, short(rb4, 160)]
              return res


          def run_one_job(region, accel, allowed, satok, tag, cpu, mem):
              """create+run one bounded GPU job with taskCount=parallelism=allowed, capture proofs, delete."""
              job = PREFIX + '-' + tag
              rec = {'region': region, 'accelerator': accel, 'job': job, 'requested_parallelism': allowed}
              env = [
                  {'name': 'C211_SA_TOKEN', 'value': satok},
                  {'name': 'C211_RUN_ID', 'value': GH_RUN_ID},
                  {'name': 'C211_PREFIX', 'value': PREFIX},
                  {'name': 'GH_TOKEN', 'value': GH_TOKEN},
                  {'name': 'GH_REPO', 'value': GH_REPO},
              ]
              # pre-clean our own id if it somehow exists
              st, rb = req('https://run.googleapis.com/v2/projects/%s/locations/%s/jobs/%s' % (PROJECT, region, job),
                           token=satok)
              rec['precheck_http'] = st
              if st == 200:
                  std, rbd = req('https://run.googleapis.com/v2/projects/%s/locations/%s/jobs/%s' % (PROJECT, region, job),
                                 token=satok, method=M_DEL)
                  rec['pre_cleanup'] = [std, short(rbd, 160)]
                  jd = jl(rbd)
                  if jd.get('name'):
                      poll_operation(jd['name'], satok, 90)
                  time.sleep(3)
              body = gpu_job_body(accel, cpu, mem, parallelism=allowed, task_count=allowed,
                                  args=task_script(PROJECT, region, tag), env=env, service_account=SA, timeout_s=300)
              st, rb = req('https://run.googleapis.com/v2/projects/%s/locations/%s/jobs?jobId=%s'
                           % (PROJECT, region, job), data=json.dumps(body).encode(), token=satok)
              rec['create'] = sig(st, rb)
              rec['create_raw'] = short(rb, 400)
              if st != 200:
                  return rec
              jc = jl(rb)
              if isinstance(jc, dict) and jc.get('name'):
                  op, opj = poll_operation(jc['name'], satok, 300)
                  rec['create_op'] = op
                  rec['create_op_done'] = bool(opj.get('done'))
                  rec['create_op_error'] = short(json.dumps(opj.get('error') or {}), 500)
                  if opj.get('error'):
                      return rec
              st, rb = req('https://run.googleapis.com/v2/projects/%s/locations/%s/jobs/%s:run'
                           % (PROJECT, region, job), data=b'{}', token=satok)
              rec['run'] = [st, short(rb, 420)]
              if st != 200:
                  std, rbd = req('https://run.googleapis.com/v2/projects/%s/locations/%s/jobs/%s' % (PROJECT, region, job),
                                 token=satok, method=M_DEL)
                  rec['cleanup'] = [std, short(rbd, 200)]
                  return rec
              deadline = time.time() + 660
              states = []
              while time.time() < deadline:
                  st3, rb3 = req('https://run.googleapis.com/v2/projects/%s/locations/%s/jobs/%s/executions?pageSize=5'
                                 % (PROJECT, region, job), token=satok)
                  j3 = jl(rb3)
                  exs = j3.get('executions') or []
                  states = [{'name': e.get('name'), 'start': e.get('startTime'), 'completion': e.get('completionTime'),
                             'counts': e.get('counts'),
                             'conditions': [{'type': c.get('type'), 'state': c.get('state'), 'msg': short(c.get('message'), 300)}
                                            for c in (e.get('conditions') or [])]} for e in exs]
                  if exs:
                      conds = exs[0].get('conditions') or []
                      if any(c.get('type') == 'Completed' and c.get('state') in ('CONDITION_SUCCEEDED', 'CONDITION_FAILED')
                             for c in conds):
                          break
                  time.sleep(8)
              rec['executions'] = states
              rec['proofs'] = collect_proofs(region, satok, tag)
              # main job delete + readback
              st6, rb6 = req('https://run.googleapis.com/v2/projects/%s/locations/%s/jobs/%s' % (PROJECT, region, job),
                             token=satok, method=M_DEL)
              rec['delete'] = [st6, short(rb6, 220)]
              j6 = jl(rb6)
              if j6.get('name'):
                  poll_operation(j6['name'], satok, 150)
              time.sleep(3)
              st7, rb7 = req('https://run.googleapis.com/v2/projects/%s/locations/%s/jobs/%s' % (PROJECT, region, job),
                             token=satok)
              rec['readback'] = [st7, short(rb7, 220)]
              st8, rb8 = req('https://run.googleapis.com/v2/projects/%s/locations/%s/jobs/%s/executions?pageSize=5'
                             % (PROJECT, region, job), token=satok)
              rec['executions_after_delete'] = [st8, short(rb8, 200)]
              # arithmetic
              payloads = {}
              for sn, txt in (rec['proofs'].get('proofs') or {}).items():
                  try:
                      idx = int(sn.split('-pf-' + tag + '-')[1].split('-')[0])
                  except Exception:
                      idx = None
                  payloads[idx] = txt
              intervals = []
              uuid_map = {}
              per_task = {}
              for idx, txt in payloads.items():
                  d = parse_interval(txt)
                  us = uuids_of(txt)
                  per_task[str(idx)] = {'host': (d.get('begin') or '').split('host=')[-1].split()[0] if d.get('begin') else None,
                                        'ts0': d.get('TS0'), 'ts1': d.get('TS1'), 'ts2': d.get('TS2'),
                                        'uuids': us, 'nvsmi_ok': bool(us)}
                  if d.get('TS0') is not None and d.get('TS2') is not None:
                      intervals.append((d['TS0'], d['TS2']))
                  for u in us:
                      uuid_map.setdefault(u, []).append(idx)
              rec['per_task'] = per_task
              rec['uuids'] = sorted(uuid_map.keys())
              rec['uuid_tasks'] = {u: v for u, v in uuid_map.items()}
              rec['measured_max_concurrent_tasks'] = max_overlap(intervals) if intervals else 0
              rec['measured_gpu_tasks_with_uuid'] = sum(1 for t in per_task.values() if t['nvsmi_ok'])
              rec['distinct_gpu_uuids'] = len(uuid_map)
              return rec


          def redact(o, secrets):
              if isinstance(o, str):
                  s = o
                  for sec in secrets:
                      if sec:
                          s = s.replace(sec, 'REDACTED')
                  return s
              if isinstance(o, list):
                  return [redact(x, secrets) for x in o]
              if isinstance(o, dict):
                  return {k: redact(v, secrets) for k, v in o.items()}
              return o


          def main():
              out = {'intent': 81754, 'project': PROJECT, 'pname': PNAME, 'sa': SA, 'prefix': PREFIX,
                     'runner_repo': GH_REPO, 'runner_run_id': GH_RUN_ID}
              aud = '//iam.googleapis.com/' + PROVIDER
              out['audience'] = aud
              out['t_start'] = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
              tok = mint(aud)
              out['mint'] = 'ok' if tok else 'MINT_FAIL'
              out['mint_len'] = len(tok or '')
              if not tok:
                  out['verdict'] = 'CHAIN_DEAD_GITHUB_OIDC_MINT_FAIL'
                  emit(out)
                  return
              body = json.dumps({'audience': aud,
                                 'grantType': 'urn:ietf:params:oauth:grant-type:token-exchange',
                                 'requestedTokenType': 'urn:ietf:params:oauth:token-type:access_token',
                                 'scope': 'https://www.googleapis.com/auth/cloud-platform',
                                 'subjectTokenType': 'urn:ietf:params:oauth:token-type:jwt',
                                 'subjectToken': tok}).encode()
              st, rb = req('https://sts.googleapis.com/v1/token', data=body)
              out['sts'] = st
              out['sts_body'] = short(rb, 500) if st != 200 else ''
              if st != 200:
                  out['verdict'] = 'CHAIN_DEAD_STS_REJECT'
                  emit(out)
                  return
              fed = jl(rb).get('access_token')
              st2, rb2 = req('https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/%s:generateAccessToken'
                             % urllib.parse.quote(SA, safe=''),
                             data=json.dumps({'scope': ['https://www.googleapis.com/auth/cloud-platform'],
                                              'lifetime': '3600s'}).encode(), token=fed)
              out['gen'] = st2
              out['gen_body'] = short(rb2, 500) if st2 != 200 else ''
              satok = jl(rb2).get('accessToken')
              if st2 != 200 or not satok:
                  out['verdict'] = 'CHAIN_DEAD_GENERATE_TOKEN_FAIL'
                  emit(out)
                  return
              out['token_len'] = len(satok)
              out['verdict'] = 'CHAIN_ALIVE'
              # identity/billing
              st, rb = req('https://cloudresourcemanager.googleapis.com/v1/projects/%s' % PNAME, token=satok)
              j = jl(rb)
              out['identity'] = {'http': st, 'projectId': j.get('projectId'), 'projectNumber': j.get('projectNumber'),
                                 'lifecycleState': j.get('lifecycleState'), 'parent': j.get('parent'),
                                 'createTime': j.get('createTime')}
              st, rb = req('https://cloudbilling.googleapis.com/v1/projects/%s/billingInfo' % PNAME, token=satok)
              j = jl(rb)
              out['billing'] = {'http': st, 'billingEnabled': j.get('billingEnabled'),
                                'billingAccountName': j.get('billingAccountName')}

              # -------------------------------------------- L4 validateOnly parallelism sweep (zero-create quota oracle)
              l4_sweep = {}
              for reg in L4_REGIONS:
                  rec = {}
                  p1 = validate(reg, 'nvidia-l4', '8', '32Gi', 1, satok, tag='l4v')
                  rec['p1'] = p1
                  rec['p1_ok'] = (p1.get('http') == 200)
                  allowed = None
                  if rec['p1_ok']:
                      for p in [2, 3, 4, 5, 6, 8, 12, 16]:
                          rr = validate(reg, 'nvidia-l4', '8', '32Gi', p, satok, tag='l4v')
                          rec['p%d' % p] = rr
                          reqd, al = parse_allowed(rr)
                          if al is not None:
                              allowed = al
                              break
                          time.sleep(0.25)
                      if allowed is None:
                          # all tested accepted; keep the largest tested
                          allowed = 16
                  rec['allowed_parallelism'] = allowed
                  l4_sweep[reg] = rec
                  time.sleep(0.3)
              out['l4_sweep'] = l4_sweep

              # -------------------------------------------- RTX allowed=3 re-confirmation (zero-create)
              rtx_confirm = {}
              for reg in RTX_REGIONS:
                  rec = {}
                  rec['p1'] = validate(reg, 'nvidia-rtx-pro-6000', '20', '80Gi', 1, satok, tag='rtxc')
                  rec['p1_ok'] = (rec['p1'].get('http') == 200)
                  rec['p4'] = validate(reg, 'nvidia-rtx-pro-6000', '20', '80Gi', 4, satok, tag='rtxc')
                  reqd, al = parse_allowed(rec['p4'])
                  rec['allowed'] = al
                  rtx_confirm[reg] = rec
                  time.sleep(0.3)
              out['rtx_confirm'] = rtx_confirm

              # -------------------------------------------- device exercise: three never-proven RTX regions, one job at a time
              jobs = []
              fail_cells = []
              for i, reg in enumerate(['us-central1', 'asia-south2', 'asia-southeast1']):
                  tag = 'rtx%s' % (i + 1)
                  r = run_one_job(reg, 'nvidia-rtx-pro-6000', 3, satok, tag, '20', '80Gi')
                  jobs.append(r)
                  ok = (r.get('distinct_gpu_uuids', 0) > 0)
                  log('job', reg, 'uuids', r.get('distinct_gpu_uuids'), 'readback', r.get('readback'))
                  if not ok:
                      fail_cells.append(reg)
                  emit({'partial': True, 'jobs_done': jobs, 'stage': 'after_' + reg})
                  time.sleep(2)

              # if an RTX cell failed (refused/stockout), use the 4th slot on the highest-ceiling never-proven L4 cell
              l4_used = None
              if fail_cells:
                  cands = [(l4_sweep[r].get('allowed_parallelism') or 0, 1 if r == 'asia-southeast1' else 0, r)
                           for r in ['asia-southeast1', 'europe-west1', 'us-east4']]
                  cands.sort(reverse=True)
                  l4reg = cands[0][2]
                  l4allowed = max(1, min(int(l4_sweep[l4reg].get('allowed_parallelism') or 1), 4))
                  r = run_one_job(l4reg, 'nvidia-l4', l4allowed, satok, 'l4a', '8', '32Gi')
                  r['l4_cell'] = l4reg
                  jobs.append(r)
                  l4_used = l4reg
                  emit({'partial': True, 'jobs_done': jobs, 'stage': 'after_l4'})
              out['jobs'] = jobs
              out['l4_device_cell'] = l4_used

              # -------------------------------------------- 7-region leftover sweep
              left = {}
              for reg in GPU_REGIONS:
                  st, rb = req('https://run.googleapis.com/v2/projects/%s/locations/%s/jobs?pageSize=200' % (PROJECT, reg),
                               token=satok)
                  names = [x.get('name', '').rsplit('/', 1)[-1] for x in (jl(rb).get('jobs') or [])] if st == 200 else []
                  left[reg] = {'http': st, 'n_jobs': len(names), 'ours': [x for x in names if x.startswith(PREFIX)]}
              out['leftover_sweep'] = left
              out['t_end'] = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
              out = redact(out, [satok, GH_TOKEN, tok])
              emit(out)
              print('DONE', flush=True)


          if __name__ == '__main__':
              try:
                  main()
              except Exception as ex:
                  import traceback
                  print('FATAL ' + repr(ex), flush=True)
                  traceback.print_exc()
                  try:
                      emit({'fatal': repr(ex)[:400]})
                  except Exception:
                      pass
          PYSCRIPT
